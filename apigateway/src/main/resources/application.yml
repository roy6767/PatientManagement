spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8889"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/patients/**

        - id: booking-module
          uri: lb://booking-module
          predicates:
            - Path=/api/v1/bookings/**

        - id: departmentservice-departments
          uri: lb://departmentservice
          predicates:
            - Path=/api/departments/**

        - id: departmentservice-doctors
          uri: lb://departmentservice
          predicates:
            - Path=/api/doctors/**

        - id: departmentservice-treatments
          uri: lb://departmentservice
          predicates:
            - Path=/api/treatments/**

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Must match the jwt.secret in auth-service (also served by Config Server)
jwt:
  secret: UGF0aWVudE1hbmFnZW1lbnRTeXN0ZW0yMDI2U2VjcmV0S2V5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
