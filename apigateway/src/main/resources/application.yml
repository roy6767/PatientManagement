server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/patients/**

        - id: department-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/departments/**,/api/v1/doctors/**,/api/v1/treatments/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/bookings/**

        - id: billing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/billing/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090   # auth-service
