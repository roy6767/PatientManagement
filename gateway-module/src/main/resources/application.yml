spring:
  application:
    name: gateway-module
  config:
    import: "optional:configserver:http://localhost:8889"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-module
          uri: lb://auth-module
          predicates:
            - Path=/api/v1/auth/**

        - id: patient-module
          uri: lb://patient-module
          predicates:
            - Path=/api/v1/patients/**

        - id: booking-module
          uri: lb://booking-module
          predicates:
            - Path=/api/v1/bookings/**

        - id: department-module-departments
          uri: lb://department-module
          predicates:
            - Path=/api/departments/**

        - id: department-module-doctors
          uri: lb://department-module
          predicates:
            - Path=/api/doctors/**

        - id: department-module-treatments
          uri: lb://department-module
          predicates:
            - Path=/api/treatments/**

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: UGF0aWVudE1hbmFnZW1lbnRTeXN0ZW0yMDI2U2VjcmV0S2V5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans