# ── Shared config delivered to every service by the Config Server ──────────────

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Distributed tracing — 100% sampling in dev; lower in prod
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# JWT — both auth-service and api-gateway must share this value
jwt.secret=UGF0aWVudE1hbmFnZW1lbnRTeXN0ZW0yMDI2U2VjcmV0S2V5
jwt.expiration=86400000
