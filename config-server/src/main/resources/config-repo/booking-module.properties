# ── Feign Circuit Breaker ────────────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled=true

# Group all methods of a FeignClient under the client name as the CB instance id
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# ── Resilience4j defaults (apply to every CB instance unless overridden) ─────
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# ── Per-instance overrides ────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.patient-service.base-config=default
resilience4j.circuitbreaker.instances.departmentservice.base-config=default

# ── Retry config (3 attempts, 500ms between) ─────────────────────────────────
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.instances.patient-service.base-config=default
resilience4j.retry.instances.departmentservice.base-config=default
